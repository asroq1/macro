

openapi: 3.0.0
info:
  title: 마이월렛(MyWallet) API
  description: 해외여행, 직구, 유학생 등 글로벌 소비자를 위한 외화 충전/결제/송금/정산 플랫폼 API
  version: 1.0.0
servers:
  - url: https://api.mywallet.com/v1
    description: 운영 서버
  - url: https://dev-api.mywallet.com/v1
    description: 개발 서버

tags:
  - name: auth
    description: 사용자 인증 관련 API
  - name: users
    description: 사용자 정보 관리 API
  - name: currencies
    description: 통화 정보 관련 API
  - name: wallets
    description: 사용자 지갑 관리 API
  - name: transactions
    description: 거래(충전/환불/송금/환전) 관련 API
  - name: cards
    description: 카드 관리 API
  - name: contacts
    description: 연락처 관리 API

paths:
  /auth/register:
    post:
      tags:
        - auth
      summary: 회원가입
      description: 새로운 사용자를 등록합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - auth
      summary: 로그인
      description: 사용자 로그인 및 인증 토큰 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
    get:
      tags:
        - users
      summary: 내 정보 조회
      description: 로그인한 사용자의 정보를 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 사용자 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /currencies:
    get:
      tags:
        - currencies
      summary: 지원 통화 목록 조회
      description: 시스템에서 지원하는 모든 통화 목록을 조회합니다.
      responses:
        '200':
          description: 통화 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'

  /exchange-rates:
    get:
      tags:
        - currencies
      summary: 실시간 환율 조회
      description: 특정 통화 쌍의 현재 환율 조회 (실시간 또는 최근 업데이트 기준)
      parameters:
        - name: from_code
          in: query
          required: true
          description: 기준 통화 코드 (예. USD)
          schema:
            type: string
            example: USD
        - name: to_code
          in: query
          required: true
          description: 대상 통화 코드 (예. KRW)
          schema:
            type: string
            example: KRW
      responses:
        '200':
          description: 환율 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
        '400':
          description: 잘못된 요청

  /wallets:
    get:
      tags:
        - wallets
      summary: 내 지갑 목록 조회
      description: 로그인한 사용자의 모든 지갑 목록을 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 지갑 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'
        '401':
          description: 인증 실패
  
  /transactions/deposit:
    post:
      tags:
        - transactions
      summary: 외화 충전
      description: 사용자 지갑에 외화를 충전합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: 충전 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: 잘못된 요청

  /transactions/withdraw:
    post:
      tags:
        - transactions
      summary: 외화 환불
      description: 지갑의 외화를 원화로 환불합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '201':
          description: 환불 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: 잘못된 요청

  /transactions/exchange:
    post:
      tags:
        - transactions
      summary: 외화간 환전
      description: 한 통화에서 다른 통화로 환전합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '201':
          description: 환전 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: 잘못된 요청

  /transactions/transfer:
    post:
      tags:
        - transactions
      summary: 친구에게 송금
      description: 등록된 연락처(친구)에게 외화를 송금합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: 송금 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: 잘못된 요청

  /transactions:
    get:
      tags:
        - transactions
      summary: 내 거래 내역 조회
      description: 로그인한 사용자의 모든 거래 내역을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - all
              - deposit
              - withdraw
              - exchange
              - transfer
              - card
          description: 거래 유형 필터 (기본값은 all)
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: 시작 날짜 (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: 종료 날짜 (YYYY-MM-DD)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: 페이지 번호
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: 페이지당 항목 수
      responses:
        '200':
          description: 거래 내역 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 45
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'

  /cards:
    get:
      tags:
        - cards
      summary: 내 카드 목록 조회
      description: 로그인한 사용자의 등록된 모든 카드 목록을 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 카드 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '401':
          description: 인증 실패

    post:
      tags:
        - cards
      summary: 카드 등록
      description: 새로운 카드를 등록합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
      responses:
        '201':
          description: 카드 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: 잘못된 요청

  /cards/{cardId}/status:
    put:
      tags:
        - cards
      summary: 카드 상태 변경
      description: 카드의 활성/비활성화 상태를 변경합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
          description: 카드 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
                  description: 카드 활성화 여부
                  example: true
      responses:
        '200':
          description: 카드 상태 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          description: 카드를 찾을 수 없음

  /cards/{cardId}/report-lost:
    post:
      tags:
        - cards
      summary: 카드 분실 신고
      description: 카드 분실 신고를 합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
          description: 카드 ID
      responses:
        '200':
          description: 카드 분실 신고 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          description: 카드를 찾을 수 없음

  /contacts:
    get:
      tags:
        - contacts
      summary: 내 연락처 목록 조회
      description: 로그인한 사용자의 등록된 연락처 목록을 조회합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 연락처 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '401':
          description: 인증 실패

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegister:
      type: object
      required:
        - email
        - password
        - name
        - phone
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securePassword123
        name:
          type: string
          example: 홍길동
        phone:
          type: string
          example: 010-1234-5678

    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securePassword123

    UserResponse:
      type: object
      properties:
        user_id:
          type: integer
          example: 123
        email:
          type: string
          example: user@example.com
        name:
          type: string
          example: 홍길동
        phone:
          type: string
          example: 010-1234-5678
        created_at:
          type: string
          format: date-time
          example: '2023-04-15T09:30:00Z'

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserResponse'

    UserDetail:
      type: object
      properties:
        user_id:
          type: integer
          example: 123
        email:
          type: string
          example: user@example.com
        name:
          type: string
          example: 홍길동
        phone:
          type: string
          example: 010-1234-5678
        created_at:
          type: string
          format: date-time
          example: '2023-04-15T09:30:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2023-04-15T09:30:00Z'
        last_login_at:
          type: string
          format: date-time
          example: '2023-04-15T09:30:00Z'

    Currency:
      type: object
      properties:
        currency_id:
          type: integer
          example: 1
        code:
          type: string
          example: USD
        name:
          type: string
          example: 미국 달러
        symbol:
          type: string
          example: $
        flag_emoji:
          type: string
          example: 🇺🇸
        is_active:
          type: boolean
          example: true

    ExchangeRate:
      type: object
      properties:
        from_currency:
          type: object
          properties:
            code:
              type: string
              example: USD
            name:
              type: string
              example: 미국 달러
        to_currency:
          type: object
          properties:
            code:
              type: string
              example: KRW
            name:
              type: string
              example: 대한민국 원
        rate:
          type: number
          example: 1324.75
        updated_at:
          type: string
          format: date-time
          example: '2023-04-15T09:30:00Z'

    Wallet:
      type: object
      properties:
        wallet_id:
          type: integer
          example: 789
        currency_code:
          type: string
          example: USD
        currency_name:
          type: string
          example: 미국 달러
        balance:
          type: number
          example: 1000.00
        created_at:
          type: string
          format: date-time
          example: '2023-04-15T09:30:00Z'

    DepositRequest:
      type: object
      required:
        - currency_code
        - amount
      properties:
        currency_code:
          type: string
          example: USD
        amount:
          type: number
          example: 100.00
        bank_account_id:
          type: integer
          example: 456

    WithdrawRequest:
      type: object
      required:
        - wallet_id
        - amount
      properties:
        wallet_id:
          type: integer
          example: 789
        amount:
          type: number
          example: 50.00
        bank_account_id:
          type: integer
          example: 456

    ExchangeRequest:
      type: object
      required:
        - from_wallet_id
        - to_currency_code
        - amount
      properties:
        from_wallet_id:
          type: integer
          example: 789
        to_currency_code:
          type: string
          example: EUR
        amount:
          type: number
          example: 100.00

    TransferRequest:
      type: object
      required:
        - from_wallet_id
        - recipient_id
        - amount
      properties:
        from_wallet_id:
          type: integer
          example: 789
        recipient_id:
          type: integer
          example: 321
        amount:
          type: number
          example: 50.00
        note:
          type: string
          example: 여행 경비 정산

    TransactionResponse:
      type: object
      properties:
        transaction_id:
          type: integer
          example: 1001
        transaction_code:
          type: string
          example: TRX12345678
        transaction_type:
          type: string
          example: deposit
        amount:
          type: number
          example: 100.00
        fee:
          type: number
          example: 1.00
        status:
          type: string
          example: completed
        created_at:
          type: string
          format: date-time
          example: '2023-04-15T09:30:00Z'

    Transaction:
      type: object
      properties:
        transaction_id:
          type: integer
          example: 1001
        transaction_code:
          type: string
          example: TRX12345678
        transaction_type:
          type: string
          example: deposit
        amount:
          type: number
          example: 100.00
        fee:
          type: number
          example: 1.00
        status:
          type: string
          example: completed
        created_at:
          type: string
          format: date-time
          example: '2023-04-15T09:30:00Z'
      
    Card:
      type: object
      properties:
        card_id:
          type: integer
          example: 555
        name:
          type: string
          example: 마이월렛 신용카드
        card_number_masked:
          type: string
          example: '****-****-****-1234'
        card_type:
          type: string
          example: 신용카드
        expiry_date:
          type: string
          example: '05/25'
        is_active:
          type: boolean
          example: true
        is_reported_lost:
          type: boolean
          example: false

    CardCreate:
      type: object
      required:
        - card_type
        - name
        - card_number
        - expiry_date
        - cvv
      properties:
        card_type:
          type: string
          example: credit
        name:
          type: string
          example: 마이월렛 신용카드
        card_number:
          type: string
          example: '1234567890123456'
        expiry_date:
          type: string
          example: '05/25'
        cvv:
          type: string
          example: '123'

    Contact:
      type: object
      properties:
        contact_id:
          type: integer
          example: 321
        name:
          type: string
          example: 김철수
        email:
          type: string
          example: chulsoo@example.com
        phone:
          type: string
          example: 010-9876-5432
        is_recent:
          type: boolean
          example: true

    Error:
      type: object
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: 요청에 오류가 있습니다.
